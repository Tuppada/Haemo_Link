spring.application.name=hemolink-backend
server.port=8080

spring.datasource.url=jdbc:h2:mem:hemolink;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.sql.init.mode=always

anthropic.api.key=${ANTHROPIC_API_KEY:}
anthropic.model=claude-haiku-4-5-20251001

hemolink.jwt.secret=${HEMOLINK_JWT_SECRET:hemolink-dev-secret-change-in-production-32chars}
hemolink.jwt.expiration-hours=24
notepad src\main\resources\application.properties